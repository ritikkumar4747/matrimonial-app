[build]
builder = "NIXPACKS"
buildCommand = "cd backend && npm install --legacy-peer-deps"

[deploy]
startCommand = "cd backend && npm start"
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[env]
NODE_ENV = "production"

[build.nixpacks]
installCommand = "npm install --legacy-peer-deps"
